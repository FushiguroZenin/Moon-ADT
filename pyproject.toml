[project]
name = "moon-dera"
version = "0.1.0"
description = "Moon personal computer agent, powered by the Dera1.4 runtime"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9,<7", "pystray>=0.19,<1", "Pillow>=10,<12"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
moon = "dera.interface.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["dera*"]
exclude = ["data*", "tests*"]
